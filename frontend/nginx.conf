server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip：前端产物里 JS/CSS 体积不小，压缩后传输量能降到三分之一左右
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA 路由回落：前端用的是 hash 路由，这条主要是防止刷新深层路径时 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 反向代理到后端容器 —— service 名就是 compose 里的 backend
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 同源反代，不转发 Origin。
        # 浏览器对同源 POST 也会带 Origin，若原样转发给后端，后端的 CORS 校验
        # 会把它当成跨域请求；而前端端口一变（8081 / 5173 / 自定义），
        # 允许列表没同步就会直接 403 "Invalid CORS request"。
        proxy_set_header Origin "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 上传/下载的敏感资料可能较大，放宽超时
        proxy_read_timeout 60s;
    }

    # 带哈希指纹的静态资源可以长期缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # index.html 不缓存，否则发版后用户会一直拿到旧入口
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
