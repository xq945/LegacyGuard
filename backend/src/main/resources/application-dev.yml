# 本地开发配置
#
# ⚠️ 本文件中的 JWT 密钥仅用于本地开发，已在仓库中公开，任何人可见。
#    生产环境必须通过环境变量 LG_JWT_SECRET 覆盖，否则等同于没有认证。
#    生成新密钥：openssl rand -base64 32

legacyguard:
  jwt:
    secret: ${LG_JWT_SECRET:MAMcroH6R8OaLE7Rl72GO3qH9NNb+2y8ffEzNJtWg+E=}
  auth:
    # 本地开发所有请求都来自 127.0.0.1，标准阈值会让调试很快撞上限流，
    # 这里放宽到 30 次/分钟。生产环境沿用 application.yml 中的 10 次。
    login-rate-limit: 30
  crypto:
    # ⚠️ 仅本地开发使用的固定主密钥，已公开在仓库中。
    #    生产环境必须通过 LG_KEK_KEYS 覆盖，否则等于没有加密。
    #    该密钥一旦用于真实数据，任何看到本仓库的人都能解密 —— 切记。
    # 注意引号位置：整段用双引号包住，引号若写进默认值内部，
    # 解析出来会变成 "1（带引号），版本号就不是数字了
    keys: "${LG_KEK_KEYS:1=cg3EyAxT7hS4hvP9Mitb02tWY+db//xLeGG90qoDNpA=}"

management:
  endpoint:
    health:
      show-details: always

mybatis-plus:
  configuration:
    # 开发期打印 SQL，便于理解 MyBatis-Plus 实际生成了什么（尤其乐观锁与条件更新）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.legacyguard: DEBUG
    org.springframework.security: INFO
    # 想看 RabbitMQ 的连接细节时打开
    org.springframework.amqp: INFO
